<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 200" width="495" height="200" role="img" aria-label="All-time GitHub stats">
<title>All-time GitHub stats</title>
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7cf6" stop-opacity=".55"/><stop offset=".5" stop-color="#24304f"/><stop offset="1" stop-color="#5eead4" stop-opacity=".55"/></linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b7cf6" stop-opacity=".45"/><stop offset="1" stop-color="#8b7cf6" stop-opacity="0"/></linearGradient>
</defs>
<style>
  text { font-family: 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes growY { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .rise { animation: rise .7s ease-out both; }
  .grow { transform-box: fill-box; transform-origin: left; animation: grow 1s cubic-bezier(.2,.8,.2,1) both; }
  .growY { transform-box: fill-box; transform-origin: bottom; animation: growY .9s cubic-bezier(.2,.8,.2,1) both; }
  .draw { stroke-dasharray: 1; animation: draw 2.2s ease-in-out both; }
  .fade { animation: fade 1.2s ease-out both; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="1" y="1" width="493" height="198" rx="14" fill="#0b1022" stroke="url(#edge)" stroke-width="1.5"/>
<circle class="pulse" cx="26" cy="31" r="4" fill="#5eead4"/>
<text x="38" y="36" font-size="14" font-weight="700" fill="#e6edf3">git stats --all-time</text>
<g class="rise" style="animation-delay:0.10s"><rect x="24" y="68" width="3" height="12" rx="1.5" fill="#8b7cf6"/><text x="36" y="78" font-size="12.5" fill="#8fa3c7">Stars earned</text><text x="222" y="78" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="end">2</text></g><g class="rise" style="animation-delay:0.18s"><rect x="260" y="68" width="3" height="12" rx="1.5" fill="#5eead4"/><text x="272" y="78" font-size="12.5" fill="#8fa3c7">Commits</text><text x="458" y="78" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="end">425</text></g><g class="rise" style="animation-delay:0.26s"><rect x="24" y="100" width="3" height="12" rx="1.5" fill="#8b7cf6"/><text x="36" y="110" font-size="12.5" fill="#8fa3c7">Pull requests</text><text x="222" y="110" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="end">24</text></g><g class="rise" style="animation-delay:0.34s"><rect x="260" y="100" width="3" height="12" rx="1.5" fill="#5eead4"/><text x="272" y="110" font-size="12.5" fill="#8fa3c7">PRs merged</text><text x="458" y="110" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="end">24</text></g><g class="rise" style="animation-delay:0.42s"><rect x="24" y="132" width="3" height="12" rx="1.5" fill="#8b7cf6"/><text x="36" y="142" font-size="12.5" fill="#8fa3c7">Issues opened</text><text x="222" y="142" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="end">1</text></g><g class="rise" style="animation-delay:0.50s"><rect x="260" y="132" width="3" height="12" rx="1.5" fill="#5eead4"/><text x="272" y="142" font-size="12.5" fill="#8fa3c7">Code reviews</text><text x="458" y="142" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="end">9</text></g><g class="rise" style="animation-delay:0.58s"><rect x="24" y="164" width="3" height="12" rx="1.5" fill="#8b7cf6"/><text x="36" y="174" font-size="12.5" fill="#8fa3c7">Contributed to (1y)</text><text x="222" y="174" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="end">1</text></g><g class="rise" style="animation-delay:0.66s"><rect x="260" y="164" width="3" height="12" rx="1.5" fill="#5eead4"/><text x="272" y="174" font-size="12.5" fill="#8fa3c7">Followers</text><text x="458" y="174" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="end">4</text></g>
</svg>
